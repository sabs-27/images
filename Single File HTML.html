<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Single Note</title>
    <script>
        (function setTabTitleFromFileName() {
            try {
                const rawPath = window.location.pathname || '';
                const fileName = decodeURIComponent(rawPath.split('/').pop() || '');
                document.title = fileName || 'Single Note';
            } catch (_) { document.title = 'Single Note'; }
        })();
    </script>


    <script>
        window.addEventListener('error', function(event) {
            console.error("Script crashed:", event.message, "Line:", event.lineno);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <style id="single-note-style">
        .content-layout-toolbar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px 0 0;
            margin-right: 2px;
            border-right: 1px solid #303030;
        }

        .content-layout-button {
            width: 34px;
            height: 32px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            background: #18181b;
            color: #e4e4e7;
            cursor: pointer;
            transition: border-color 120ms ease, background 120ms ease, transform 90ms ease;
        }

        .content-layout-button:hover:not(:disabled) {
            border-color: #71717a;
            background: #27272a;
            color: #ffffff;
        }

        .content-layout-button:active:not(:disabled) { transform: translateY(1px); }
        .content-layout-button:disabled { opacity: 0.32; cursor: not-allowed; }

        .content-layout-button svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .highlight-toolbar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px 0 0;
            margin-right: 2px;
            border-right: 1px solid #303030;
        }

        .highlight-color-button,
        .unhighlight-mode-button {
            position: relative;
            flex: 0 0 auto;
            height: 32px;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            background: #18181b;
            color: #f4f4f5;
            cursor: pointer;
            transition: border-color 120ms ease, transform 120ms ease, background 120ms ease;
        }

        .highlight-color-button {
            width: 32px;
            padding: 5px;
        }

        .highlight-color-button:hover,
        .unhighlight-mode-button:hover {
            border-color: #71717a;
            background: #27272a;
        }

        .highlight-color-button.active,
        .unhighlight-mode-button.active {
            border-color: #ffffff;
            box-shadow: 0 0 0 2px #000000, 0 0 0 4px #ffffff;
            transform: translateY(-1px);
        }

        .highlight-swatch {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }

        .highlight-mode-close {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 17px;
            height: 17px;
            display: none;
            place-items: center;
            border: 1px solid #71717a;
            border-radius: 999px;
            background: #09090b;
            color: #ffffff;
            font: 700 12px/1 Arial, sans-serif;
            pointer-events: none;
        }

        .highlight-color-button.active .highlight-mode-close,
        .unhighlight-mode-button.active .highlight-mode-close {
            display: grid;
        }

        .unhighlight-mode-button {
            min-width: 76px;
            padding: 0 8px;
            font-size: 11px;
            font-weight: 750;
        }

        #content-renderer.highlight-color-active {
            cursor: text;
            user-select: text;
        }

        #content-renderer.unhighlight-active mark[data-highlight-id] {
            cursor: pointer;
            outline: 2px dashed rgba(255, 255, 255, 0.9);
            outline-offset: 2px;
        }

        #content-renderer mark[data-highlight-id] {
            display: inline;
            padding: 0;
            margin: 0;
            border: 0;
            border-radius: 0.12em;
            font: inherit;
            letter-spacing: inherit;
            line-height: inherit;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            text-shadow: none;
        }

        #content-renderer mark[data-highlight-color="yellow"] { background: #fde047; color: #111827; }
        #content-renderer mark[data-highlight-color="blue"]   { background: #60a5fa; color: #07111f; }
        #content-renderer mark[data-highlight-color="green"]  { background: #4ade80; color: #052e16; }
        #content-renderer mark[data-highlight-color="pink"]   { background: #f472b6; color: #3b071d; }
        #content-renderer mark[data-highlight-color="orange"] { background: #fb923c; color: #431407; }

        .hidden { display: none !important; }

        #content-viewer {
            position: fixed;
            inset: 0;
            z-index: 10000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
            background: #000000;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: pan-x pan-y pinch-zoom;
            overscroll-behavior: none;
        }

        .content-viewer-header {
            position: relative;
            top: 0;
            z-index: 2;
            flex: 0 0 auto;
            min-width: 0;
            min-height: 58px;

            display: flex;
            align-items: center;
            gap: 10px;
            padding:
                calc(7px + env(safe-area-inset-top))
                calc(12px + env(safe-area-inset-right))

                calc(14px + env(safe-area-inset-left));

        #content-node-title {

            color: #f5f5f5;
            font-size: 17px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewer-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #content-scroll-area {
            flex: 1 1 0;
            min-width: 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: auto;
            overscroll-behavior: contain;
            scroll-behavior: auto;
            scroll-padding-block: 40px 96px;
            overflow-anchor: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y pinch-zoom;
        }

        #content-renderer {
            overflow-anchor: none;
        }

        #content-zoom-stage {
            position: relative;
            width: 100%;
            min-width: 100%;
            min-height: 100%;
            overflow: visible;
        }

        #content-scroll-area::-webkit-scrollbar,
        #content-renderer .table-shell::-webkit-scrollbar,
        #content-renderer pre::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        #content-renderer {
            --content-horizontal-offset: 0px;
            --content-view-zoom: 1;
            position: absolute;
            top: 0;
            left: 0;
            width: min(1420px, calc(100vw - 112px));
            min-height: calc(100vh - 70px);
            min-height: calc(100dvh - 70px);
            box-sizing: border-box;
            margin: 0;
            padding:
                40px
                max(0px, env(safe-area-inset-right))
                calc(72px + env(safe-area-inset-bottom))
                max(0px, env(safe-area-inset-left));
            zoom: var(--content-view-zoom);
            transform: translateX(var(--content-horizontal-offset));
            transition: none;
            will-change: transform;
            color: #f1f1f1;
            font-size: clamp(16px, 1vw, 20px);
            line-height: 1.5;
            word-break: normal;
            overflow-wrap: break-word;
        }

        #content-renderer:empty {
            min-height: calc(100vh - 70px);
            min-height: calc(100dvh - 70px);
        }

        #content-renderer .decision-tree-plain,
        #content-renderer .code-shell,
        #content-renderer .table-shell,
        #content-renderer pre,
        #content-renderer table {
            text-align: left;
        }

        #content-renderer h1,
        #content-renderer h2,
        #content-renderer h3,
        #content-renderer h4,
        #content-renderer h5,

        #content-renderer h3 { margin-top: 26px; font-size: clamp(22px, 1.55vw, 29px); }
        #content-renderer h4 { margin-top: 22px; font-size: clamp(19px, 1.3vw, 25px); }
        #content-renderer h5 { margin-top: 20px; font-size: clamp(17px, 1.15vw, 22px); }
        #content-renderer h6 { margin-top: 18px; color: #d4d4d8; font-size: clamp(16px, 1vw, 20px); }

        #content-renderer > :first-child { margin-top: 0; }
        #content-renderer p { margin: 0 0 13px; }

    <script id="single-note-engine">
(() => {
    'use strict';

    const DATA_ID = 'single-note-data';
    const renderer = document.getElementById('content-renderer');
    const scrollArea = document.getElementById('content-scroll-area');
    const editorModal = document.getElementById('content-editor-modal');
    const textarea = document.getElementById('content-editor-textarea');
    const documentSize = document.getElementById('editor-document-size');
    const saveButton = document.getElementById('editor-save-button');
    const openEditorButton = document.getElementById('open-editor-button');
    const fontDecreaseButton = document.getElementById('content-font-decrease');
    const fontIncreaseButton = document.getElementById('content-font-increase');
    const shiftLeftButton = document.getElementById('content-shift-left-button');
    const shiftRightButton = document.getElementById('content-shift-right-button');
    const fullscreenEnterButton = document.getElementById('fullscreen-enter-button');
    const fullscreenExitButton = document.getElementById('fullscreen-exit-button');
    const fullscreenFloatingExitButton = document.getElementById('fullscreen-floating-exit-button');
    const highlightButtons = [...document.querySelectorAll('[data-highlight-mode]')];
    const addImagesButton = document.getElementById('add-images-button');
    const addFolderButton = document.getElementById('add-folder-button');
    const embeddedImagesInput = document.getElementById('embedded-images-input');
    const embeddedFolderInput = document.getElementById('embedded-folder-input');
    const galleryImportStatus = document.getElementById('gallery-import-status');

    const allowedHighlightColors = new Set(['yellow', 'blue', 'green', 'pink', 'orange']);
    let activeHighlightMode = '';
    let editorCommitTimer = 0;
    let fileTimer = 0;
    let currentFileHandle = null;
    let rememberedFileHandle = null;
    const FILE_HANDLE_DB = 'GradStudioSingleNoteFileHandles';
    const FILE_HANDLE_STORE = 'handles';
    let pendingSelectionOffsets = null;
    let selectionCaptureTimer = 0;
    let suppressAutoHighlightUntil = 0;
    let galleryImportBusy = false;

    function parseEmbeddedState() {
        try {
            const raw = document.getElementById(DATA_ID)?.textContent || '{}';
            return JSON.parse(raw);
        } catch (error) {
            console.warn('Embedded note state could not be read.', error);
            return {};
        }
    }

    const embeddedState = parseEmbeddedState();

    const sourceState = embeddedState;

    let state = {
        version: 6,
        revision: Number(sourceState.revision) || 0,
        markdown: String(sourceState.markdown || ''),
        fontSize: clamp(Number(sourceState.fontSize) || 18, 7, 34),
        horizontalOffset: 0,
        highlights: Array.isArray(sourceState.highlights) ? sourceState.highlights : [],
        galleries: sourceState.galleries && typeof sourceState.galleries === 'object' ? sourceState.galleries : {}
    };

    function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
    }

    function showStatus(message, duration = 2300) {
        return;
    }

    function getPortableState() {
        return { ...state, horizontalOffset: 0 };
    }

    function persistEmbeddedStateInPage() {
        const embedded = document.getElementById(DATA_ID);
        if (embedded) embedded.textContent = JSON.stringify(getPortableState()).replace(/</g, '\\u003c');
    }

    function persistLocalState() {
    }

    function touchRevision() {
        state.revision = Date.now();
        persistEmbeddedStateInPage();
        persistLocalState();
    }

    function isSameFileSaveSession() {
        return (location.protocol === 'http:' || location.protocol === 'https:')
            && (location.hostname === '127.0.0.1' || location.hostname === 'localhost');
    }



    function getCurrentHtmlFilename() {
        try {
            if (location.protocol !== 'file:') return '';
            return decodeURIComponent(location.pathname.split('/').pop() || '').trim();
        } catch (_) { return ''; }
    }

    function fileHandleKey(name) { return String(name || '').trim().toLowerCase(); }

    function openFileHandleDb() {
        return new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) { resolve(null); return; }
            const request = indexedDB.open(FILE_HANDLE_DB, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(FILE_HANDLE_STORE)) db.createObjectStore(FILE_HANDLE_STORE);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error || new Error('IndexedDB unavailable'));
        });
    }

    async function rememberFileHandle(handle) {
        if (!handle || !handle.name) return;
        try {
            const db = await openFileHandleDb();
            if (!db) return;
            await new Promise((resolve, reject) => {
                const tx = db.transaction(FILE_HANDLE_STORE, 'readwrite');
                tx.objectStore(FILE_HANDLE_STORE).put(handle, fileHandleKey(handle.name));
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error || new Error('Could not remember file handle'));
                tx.onabort = () => reject(tx.error || new Error('Could not remember file handle'));
            });
            db.close();
            rememberedFileHandle = handle;
        } catch (error) { console.warn('Could not remember writable file handle.', error); }
    }

    async function loadRememberedFileHandle() {
        const currentName = getCurrentHtmlFilename();
        if (!currentName || !('indexedDB' in window)) return null;
        try {
            const db = await openFileHandleDb();
            if (!db) return null;
            const handle = await new Promise((resolve, reject) => {
                const tx = db.transaction(FILE_HANDLE_STORE, 'readonly');
                const request = tx.objectStore(FILE_HANDLE_STORE).get(fileHandleKey(currentName));
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => reject(request.error || new Error('Could not load file handle'));
            });
            db.close();
            if (!handle || String(handle.name || '').toLowerCase() !== currentName.toLowerCase()) return null;
            rememberedFileHandle = handle;
            return handle;
        } catch (error) { console.warn('Could not restore writable file handle.', error); return null; }
    }

    async function restoreWritableHandleWithoutPrompt() {
        const handle = rememberedFileHandle || await loadRememberedFileHandle();
        if (!handle) return null;
        try {
            if (typeof handle.queryPermission !== 'function') return null;
            const permission = await handle.queryPermission({ mode: 'readwrite' });
            if (permission === 'granted') { currentFileHandle = handle; return handle; }
        } catch (_) {}
        return null;
    }

    async function activateRememberedWritableHandle() {
        if (currentFileHandle) return currentFileHandle;
        const handle = rememberedFileHandle || await loadRememberedFileHandle();
        if (!handle) return null;
        try {
            let permission = typeof handle.queryPermission === 'function' ? await handle.queryPermission({ mode: 'readwrite' }) : 'prompt';
            if (permission !== 'granted' && typeof handle.requestPermission === 'function') permission = await handle.requestPermission({ mode: 'readwrite' });
            if (permission === 'granted') { currentFileHandle = handle; return handle; }
        } catch (error) { console.warn('Writable permission was not restored.', error); }
        return null;
    }

    function buildPortableHtmlSource() {
        persistEmbeddedStateInPage();

        const clone = document.documentElement.cloneNode(true);
        const embedded = clone.querySelector('#' + DATA_ID);
        if (embedded) embedded.textContent = JSON.stringify(getPortableState()).replace(/</g, '\\u003c');

        const modal = clone.querySelector('#content-editor-modal');
        if (modal) modal.classList.add('hidden');

        const cloneTextarea = clone.querySelector('#content-editor-textarea');
        if (cloneTextarea) {
            cloneTextarea.textContent = '';
            cloneTextarea.value = '';
        }

        clone.querySelectorAll('#embedded-images-input, #embedded-folder-input').forEach(input => { try { input.value = ''; } catch (_) {} });

        const cloneSave = clone.querySelector('#editor-save-button');
        if (cloneSave) {
            cloneSave.removeAttribute('disabled');
            cloneSave.textContent = 'Save & Close';
        }
const cloneRenderer = clone.querySelector('#content-renderer');
        if (cloneRenderer) {
            cloneRenderer.innerHTML = '';
            cloneRenderer.classList.remove('highlight-color-active', 'unhighlight-active');
        }

        clone.querySelectorAll('[data-highlight-mode]').forEach(button => {
            button.classList.remove('active');
            button.setAttribute('aria-pressed', 'false');
        });

        const enterButton = clone.querySelector('#fullscreen-enter-button');
        const exitButton = clone.querySelector('#fullscreen-exit-button');
        if (enterButton) enterButton.removeAttribute('disabled');
        if (exitButton) exitButton.setAttribute('disabled', '');

        return '<!DOCTYPE html>\n' + clone.outerHTML;
    }

    function getSuggestedHtmlName(savedCopy = false) {
        let base = 'GradStudio_Single_Note.html';
        try {
            if (location.protocol === 'file:') {
                const raw = decodeURIComponent(location.pathname.split('/').pop() || base);
                if (/\.html?$/i.test(raw)) base = raw;
            }
        } catch (_) {}

        if (!savedCopy) return base;
        return base.replace(/\.html?$/i, '') + '_SAVED.html';
    }

    async function writeHandle(handle, html) {
        const writable = await handle.createWritable();
        await writable.write(new Blob([html], { type: 'text/html;charset=utf-8' }));
        await writable.close();
    }

    async function writeSameHtmlFile() {
        persistEmbeddedStateInPage();
        if (!isSameFileSaveSession()) return false;
        const response = await fetch('/save', {
            method: 'POST',
            headers: { 'Content-Type': 'text/html; charset=utf-8' },
            body: buildPortableHtmlSource(),
            cache: 'no-store'
        });
        if (!response.ok) throw new Error(`Save failed: ${response.status}`);
        return true;
    }

    function downloadPortableHtml(html) {
        const filename = getSuggestedHtmlName(true);
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        return filename;
    }

    async function savePortableHtmlInteractive() {
        const html = buildPortableHtmlSource();
        if (isSameFileSaveSession()) {
            await writeSameHtmlFile();
            return { method: 'same-file', filename: getSuggestedHtmlName(false) };
        }
        if (currentFileHandle) {
            await writeHandle(currentFileHandle, html);
            await rememberFileHandle(currentFileHandle);
            return { method: 'same-file', filename: currentFileHandle.name || getSuggestedHtmlName(false) };
        }
        const restoredHandle = await activateRememberedWritableHandle();
        if (restoredHandle) {
            await writeHandle(restoredHandle, html);
            await rememberFileHandle(restoredHandle);
            return { method: 'same-file', filename: restoredHandle.name || getSuggestedHtmlName(false) };
        }
        const isContentUri = location.protocol === 'content:';
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        if (!isContentUri && !isMobile && typeof window.showSaveFilePicker === 'function') {
            currentFileHandle = await window.showSaveFilePicker({
                suggestedName: getSuggestedHtmlName(false),
                types: [{ description: 'HTML file', accept: { 'text/html': ['.html', '.htm'] } }]
            });
            await writeHandle(currentFileHandle, html);
            await rememberFileHandle(currentFileHandle);
            return { method: 'same-file', filename: currentFileHandle.name || getSuggestedHtmlName(false) };
        }
        const filename = downloadPortableHtml(html);
        return { method: 'download', filename };
    }

    function scheduleOriginalAutosave() {
        clearTimeout(fileTimer);
        if (!currentFileHandle && !isSameFileSaveSession()) return;
        fileTimer = setTimeout(async () => {
            try {
                const html = buildPortableHtmlSource();
                if (currentFileHandle) await writeHandle(currentFileHandle, html);
                else await writeSameHtmlFile();
            } catch (error) {
                console.warn('Physical HTML autosave failed.', error);
            }
        }, 450);
    }

    function normalizeImageSource(value) {
        let v = String(value || '').trim();
        if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
            v = v.slice(1, -1).trim();
        }
        if (/^[a-zA-Z]:\\/.test(v)) {
            return encodeURI('file:///' + v.replace(/\\/g, '/'));
        }
        return v;
    }

    function normalizeImageShortcuts(markdown) {
        const lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n');
        const output = [];
        let fenceChar = '';
        let groupedLines = null;

        function extractGroupedImageUrls(raw) {
            const matches = String(raw || '').match(/https?:\/\/[^\s<>"']+/gi) || [];
            return matches
                .map(value => value.replace(/[\]\)!;,]+$/g, '').trim())
                .map(normalizeImageSource)
                .filter(Boolean);
        }

        function emitGroupedImageBlock(rawBlock) {
            const urls = extractGroupedImageUrls(rawBlock);
            if (!urls.length) {
                output.push(rawBlock);
                return;
            }
            const packed = encodeURIComponent(JSON.stringify(urls));
            output.push(`<div class="linked-image-gallery" data-image-links="${escapeHtml(packed)}"></div>`);
        }

        for (const line of lines) {
            const trimmed = line.trim();
            const fenceMatch = trimmed.match(/^(`{3,}|~{3,})/);

            if (groupedLines !== null) {
                groupedLines.push(line);
                if (/\]\s*!\s*$/.test(trimmed) || trimmed.includes(']!')) {
                    emitGroupedImageBlock(groupedLines.join('\n'));
                    groupedLines = null;
                }
                continue;
            }

            if (fenceMatch) {
                const char = fenceMatch[1][0];
                if (!fenceChar) fenceChar = char;
                else if (fenceChar === char) fenceChar = '';
                output.push(line);
                continue;
            }
            if (fenceChar) {
                output.push(line);
                continue;
            }

            if (/^!\[/.test(trimmed) && !/^!\[[^\]]*\]\s*\(/.test(trimmed)) {
                if (/\]\s*!/.test(trimmed)) {
                    emitGroupedImageBlock(trimmed);
                } else {
                    groupedLines = [line];
                }
                continue;
            }

            const shortcut = trimmed.match(/^!!\s*(.+)$/);
            if (shortcut) {
                const src = normalizeImageSource(shortcut[1]);
                output.push(src ? `<img alt="Image" src="${escapeHtml(src)}">` : line);
                continue;
            }

            output.push(line);
        }

        if (groupedLines !== null) output.push(groupedLines.join('\n'));
        return output.join('\n');
    }

    function looksLikeDecisionTree(source) {
        const text = String(source || '');
        if (/```|~~~/.test(text)) return false;
        const connectorChars = (text.match(/[│├└─┬┼┤┐┘┌┴]/g) || []).length;
        return connectorChars >= 4 && text.split('\n').length >= 3;
    }

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function fallbackInline(text) {
        let html = escapeHtml(text);
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">');
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        return html;
    }

    function fallbackMarkdown(source) {
        const lines = String(source || '').split('\n');
        const out = [];
        let paragraph = [];
        let inFence = false;
        let fenceChar = '';
        let language = '';
        let code = [];
        let listType = '';

        const flushParagraph = () => {
            if (!paragraph.length) return;
            out.push('<p>' + paragraph.map(fallbackInline).join('<br>') + '</p>');
            paragraph = [];
        };

        const closeList = () => {
            if (!listType) return;
            out.push(`</${listType}>`);
            listType = '';
        };

        for (const line of lines) {
            const fence = line.match(/^\s*(`{3,}|~{3,})(.*)$/);
            if (fence) {
                flushParagraph();
                closeList();
                if (!inFence) {
                    inFence = true;
                    fenceChar = fence[1][0];
                    language = fence[2].trim();
                    code = [];
                } else if (fence[1][0] === fenceChar) {
                    out.push(`<pre><code class="language-${escapeHtml(language || 'text')}">${escapeHtml(code.join('\n'))}</code></pre>`);
                    inFence = false;
                    fenceChar = '';
                    language = '';
                    code = [];
                }
                continue;
            }

            if (inFence) {
                code.push(line);
                continue;
            }

            if (!line.trim()) {
                flushParagraph();
                closeList();
                continue;
            }

            const heading = line.match(/^(#{1,6})\s+(.+)$/);
            if (heading) {
                flushParagraph();
                closeList();
                const level = heading[1].length;
                out.push(`<h${level}>${fallbackInline(heading[2])}</h${level}>`);
                continue;
            }

            if (/^\s*---+\s*$/.test(line)) {
                flushParagraph();
                closeList();
                out.push('<hr>');
                continue;
            }

            const quote = line.match(/^\s*>\s?(.*)$/);
            if (quote) {
                flushParagraph();
                closeList();
                out.push(`<blockquote>${fallbackInline(quote[1])}</blockquote>`);
                continue;
            }

            const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
            const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
            if (unordered || ordered) {
                flushParagraph();
                const wanted = unordered ? 'ul' : 'ol';
                if (listType !== wanted) {
                    closeList();
                    listType = wanted;
                    out.push(`<${wanted}>`);
                }
                out.push(`<li>${fallbackInline((unordered || ordered)[1])}</li>`);
                continue;
            }

            paragraph.push(line);
        }

        flushParagraph();
        closeList();
        if (inFence) {
            out.push(`<pre><code class="language-${escapeHtml(language || 'text')}">${escapeHtml(code.join('\n'))}</code></pre>`);
        }
        return out.join('\n');
    }

                ctx.strokeStyle='#666'; if(sx(0)>=0&&sx(0)<=w){ctx.beginPath();ctx.moveTo(sx(0),0);ctx.lineTo(sx(0),h);ctx.stroke();} if(sy(0)>=0&&sy(0)<=h){ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(w,sy(0));ctx.stroke();}

            }
            function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(3,devicePixelRatio||1);w=Math.max(1,r.width);h=Math.max(1,r.height);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);draw();}

    function compileGraphExpression(input) {
        let e=String(input||'').trim().replace(/[−–—]/g,'-').replace(/π/g,'pi').replace(/²/g,'^2').replace(/³/g,'^3').replace(/^\s*(?:y|f\s*\(\s*x\s*\))\s*=\s*/i,'');
        if(!e||!/^[0-9A-Za-z_+\-*/^().,\s]+$/.test(e)) throw new Error('bad');
        const ok=new Set(['x','sin','cos','tan','asin','acos','atan','sqrt','abs','exp','ln','log','log10','floor','ceil','round','min','max','pow','pi','e']);
        if((e.match(/[A-Za-z_]\w*/g)||[]).some(n=>!ok.has(n.toLowerCase()))) throw new Error('bad');
        e=e.replace(/(\d|x|\))\s*(?=(x|pi|e|sin|cos|tan|asin|acos|atan|sqrt|abs|exp|ln|log|log10|floor|ceil|round|\())/gi,'$1*').replace(/\bpi\b/gi,'Math.PI').replace(/\be\b/g,'Math.E');
        const map={sin:'sin',cos:'cos',tan:'tan',asin:'asin',acos:'acos',atan:'atan',sqrt:'sqrt',abs:'abs',exp:'exp',floor:'floor',ceil:'ceil',round:'round',min:'min',max:'max',pow:'pow',ln:'log',log:'log10',log10:'log10'};
        e=e.replace(/\b(sin|cos|tan|asin|acos|atan|sqrt|abs|exp|floor|ceil|round|min|max|pow|ln|log10|log)\b/gi,n=>'Math.'+map[n.toLowerCase()]).replace(/\^/g,'**');
        return new Function('x','"use strict"; return ('+e+');');
    }

    function titleFromUrlPath(url) {

                .replace(/\.(?:html?|php|aspx?)$/i, '')

                .replace(/\s+/g, ' ')
                .trim();
            if (slug.length < 12 || slug.split(/\s+/).length < 3) return '';

    function decodePreviewEntities(value){

        if(!raw||!/[&][#A-Za-z0-9]+;/.test(raw))return raw;

    function cleanPreviewText(v,n=500){return decodePreviewEntities(String(v||'')).replace(/\s+/g,' ').trim().slice(0,n)}
    function badPreviewText(v){return /request could not be satisfied|access denied|forbidden|cloudfront|error 403|captcha|temporarily unavailable|verifying the device|checking your browser|just a moment|enable javascript|security check|bot verification|are you human/i.test(String(v||''));}

    function metadataImage(v){return imageUrl(v&&v.url?v.url:v)}

    function isLikelyPreviewAsset(url){
        const v=String(url||'').toLowerCase();
        if(!/^https?:\/\//.test(v))return false;
        // Reject obvious site chrome, avatars, logos and tracking pixels. These are
        // not article/post photos and should never beat a content image.
        if(/favicon|logo|icon|sprite|avatar|profile|badge|tracking|pixel|analytics|placeholder|spinner|loader/.test(v))return false;
        return true;
    }
    function uniquePreviewImages(items){
        const out=[];
        for(const item of items||[]){
            const u=imageUrl(item);
            if(!isLikelyPreviewAsset(u)||out.includes(u))continue;
            out.push(u);
        }
        return out;
    }
    function extractReaderImages(data){
        const found=[];
        const add=v=>{const u=imageUrl(v);if(isLikelyPreviewAsset(u)&&!found.includes(u))found.push(u)};
        if(data&&Array.isArray(data.images))data.images.forEach(add);
        if(data&&data.images&&typeof data.images==='object'&&!Array.isArray(data.images))Object.values(data.images).forEach(add);
        const c=String(data&&data.content||'');
        // Markdown images returned by Reader. In news articles this is normally the
        // full content photo, unlike og:image which is often a 1.91:1 social crop.
        for(const m of c.matchAll(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)(?:\s+\"[^\"]*\")?\)/gi))add(m[1]);
        // Some pages expose the source image as a plain URL in the extracted text.
        for(const m of c.matchAll(/https?:\/\/[^\s<>'")]+(?:\.(?:jpe?g|png|webp|avif)(?:\?[^\s<>'")]+)?)/gi))add(m[0]);
        return found;
    }
    function mergePreviewMeta(base,next){
        if(!next)return base;
        const title=cleanPreviewText(next.title,320),description=cleanPreviewText(next.description,500),siteName=cleanPreviewText(next.siteName||next.publisher||next.hostname,100);
        return{
            ...base,
            title:title&&!badPreviewText(title)?title:base.title,
            description:description&&!badPreviewText(description)?description:base.description,
            siteName:siteName||base.siteName,
            image:metadataImage(next.image)||base.image||'',

    }
    async function getLinkMeta(rawUrl){
        if(linkPreviewMetadataCache.has(rawUrl))return linkPreviewMetadataCache.get(rawUrl);
        const p=(async()=>{
            const f=previewFallback(rawUrl);
            if(f.isYouTube){
                try{
                    const d=await fetchJson(`https://www.youtube.com/oembed?url=${encodeURIComponent(rawUrl)}&format=json`,7000);
                    return{...f,title:cleanPreviewText(d.title,320)||f.title,siteName:cleanPreviewText(d.author_name,100)||'YouTube',image:imageUrl(d.thumbnail_url)||f.image,imageCandidates:[imageUrl(d.thumbnail_url)||f.image]};
                }catch(_){}
            }

            let best={...f,imageCandidates:[]};
            let socialImages=[];
            let contentImages=[];

            // OpenGraph metadata is excellent for title/description, but og:image is
            // frequently an intentionally cropped social card. Keep it as fallback,
            // not as the first visual candidate.
            try{
                const d=await fetchJson(`https://api.linkmetadata.com/v1/metadata?prefer=og&url=${encodeURIComponent(rawUrl)}`,9000);
                if(d&&d.title&&!badPreviewText(d.title)){
                    best=mergePreviewMeta(best,{
                        title:d.title,
                        description:d.description,
                        siteName:(d.og&&d.og['og:site_name'])||f.siteName,
                        favicon:d.favicon
                    });
                    socialImages.push(d.image);
                    if(d.og){
                        socialImages.push(d.og['og:image'],d.og['og:image:url'],d.og['og:image:secure_url']);
                    }
                }
            }catch(_){}

            // Microlink can expose the page's extracted media as well as social data.
            try{
                const d=(await fetchJson(`https://api.microlink.io/?url=${encodeURIComponent(rawUrl)}&prerender=true`,10000)).data||{};
                if(d.title&&!badPreviewText(d.title)&&!badPreviewText(d.description)){
                    best=mergePreviewMeta(best,{
                        title:d.title,
                        description:d.description,
                        siteName:d.publisher||d.siteName,
                        logo:d.logo
                    });
                    socialImages.push(d.image);
                    // Some Microlink responses expose extra media collections.
                    if(Array.isArray(d.images))contentImages.push(...d.images);
                    if(d.video&&d.video.poster)contentImages.push(d.video.poster);
                }
            }catch(_){}

            // Reader is intentionally checked even when OpenGraph succeeded. The first
            // article image from extracted content is usually the uncropped source photo
            // visible inside the article itself. This fixes the apparent 'CSS crop' bug.
            try{
                const r=await fetch(`https://r.jina.ai/${rawUrl}`,{headers:{Accept:'application/json'},mode:'cors',cache:'force-cache'});
                if(r.ok){
                    const payload=await r.json(),d=payload.data||payload;
                    if(d.title&&!badPreviewText(d.title)){
                        best=mergePreviewMeta(best,{title:d.title,description:d.description});
                        contentImages.push(...extractReaderImages(d));
                    }
                }
            }catch(_){}

            contentImages=uniquePreviewImages(contentImages);
            socialImages=uniquePreviewImages(socialImages);
            best.imageCandidates=uniquePreviewImages([...contentImages,...socialImages]);
            best.image=best.imageCandidates[0]||'';
            return best;
        })();
        linkPreviewMetadataCache.set(rawUrl,p);
        return p;
    }

            const card=root.querySelector('.card'),thumb=root.querySelector('.thumb'),img=root.querySelector('img'),brand=root.querySelector('.brand-fallback'),brandMark=root.querySelector('.brand-mark'),brandName=root.querySelector('.brand-name'),brandDomain=root.querySelector('.brand-domain'),title=root.querySelector('.title'),desc=root.querySelector('.desc'),site=root.querySelector('.site'),url=root.querySelector('.url');

    function naturalFileSort(a, b) {
        return String(a && a.name || '').localeCompare(String(b && b.name || ''), undefined, { numeric:true, sensitivity:'base' });
    }

    function makeGalleryId() {
        let n = 1;
        while (state.galleries[`gallery-${n}`]) n++;
        return `gallery-${n}`;
    }

    function dataUrlFromBlob(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ''));
            reader.onerror = () => reject(reader.error || new Error('Image read failed'));
            reader.readAsDataURL(blob);
        });
    }

    async function loadImageBitmapSafe(file) {
        if ('createImageBitmap' in window) {
            try { return await createImageBitmap(file, { imageOrientation:'from-image' }); } catch (_) {}
        }
        const url = URL.createObjectURL(file);
        try {
            const img = new Image();
            img.decoding = 'async';
            await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
            return img;
        } finally { setTimeout(() => URL.revokeObjectURL(url), 0); }
    }

    async function compressImageFile(file, { maxWidth=1600, maxHeight=2000, quality=.82 } = {}) {
        const source = await loadImageBitmapSafe(file);
        const sw = Number(source.width || source.naturalWidth || 1);
        const sh = Number(source.height || source.naturalHeight || 1);
        const ratio = Math.min(1, maxWidth / sw, maxHeight / sh);
        const width = Math.max(1, Math.round(sw * ratio));
        const height = Math.max(1, Math.round(sh * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d', { alpha:true });
        ctx.drawImage(source, 0, 0, width, height);
        if (source && typeof source.close === 'function') { try { source.close(); } catch (_) {} }
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', quality));
        const finalBlob = blob || file;
        const data = await dataUrlFromBlob(finalBlob);
        return { name:file.name || 'image', data, width, height, bytes:finalBlob.size || 0, originalBytes:file.size || 0 };
    }

    function insertTextAtEditorCursor(text) {
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? start;
        let prefix = '';
        let suffix = '';
        if (start > 0 && textarea.value[start - 1] !== '\n') prefix = '\n';
        if (start > 1 && textarea.value.slice(Math.max(0,start-2), start) !== '\n\n') prefix = '\n' + prefix;
        if (end < textarea.value.length && textarea.value[end] !== '\n') suffix = '\n';
        suffix += '\n';
        const insertion = `${prefix}${text}${suffix}`;
        textarea.setRangeText(insertion, start, end, 'end');
        textarea.dispatchEvent(new Event('input', { bubbles:true }));
    }

    function galleryReferencedIds(markdown = state.markdown) {
        const ids = new Set();
        for (const match of String(markdown || '').matchAll(/\[\[CAROUSEL:([A-Za-z0-9_-]+)\]\]/gi)) ids.add(match[1]);
        return ids;
    }

    function pruneOrphanedGalleries(markdown = state.markdown) {
        const keep = galleryReferencedIds(markdown);
        let changed = false;
        for (const id of Object.keys(state.galleries || {})) {
            if (!keep.has(id)) { delete state.galleries[id]; changed = true; }
        }
        return changed;
    }

    function setGalleryImportUi(busy, text='') {
        galleryImportBusy = busy;
        if (addImagesButton) addImagesButton.disabled = busy;
        if (addFolderButton) addFolderButton.disabled = busy;
        if (saveButton) saveButton.disabled = busy;
