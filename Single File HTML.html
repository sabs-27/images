    async function importImageFilesAsGallery(fileList, preferredTitle='') {
        if (galleryImportBusy) return;
        const files = [...(fileList || [])].filter(file => file && /^image\//i.test(file.type || '')).sort(naturalFileSort);
        if (!files.length) { setGalleryImportUi(false, 'No images found'); setTimeout(()=>{if(galleryImportStatus)galleryImportStatus.textContent=''},1800); return; }
        const id = makeGalleryId();
        const title = cleanPreviewText(preferredTitle, 120) || `Image Carousel ${Object.keys(state.galleries || {}).length + 1}`;
        const gallery = { id, title, images:[], createdAt:Date.now(), settings:{ maxWidth:1600, maxHeight:2000, quality:.82 } };
        let compressedBytes = 0;
        setGalleryImportUi(true, `Compressing 0 / ${files.length}`);
        try {
            for (let index=0; index<files.length; index++) {
                const file = files[index];
                setGalleryImportUi(true, `Compressing ${index + 1} / ${files.length} · ${file.name}`);
                try {
                    const item = await compressImageFile(file, gallery.settings);
                    gallery.images.push(item);
                    compressedBytes += Number(item.bytes) || 0;
                } catch (error) {
                    console.warn('Image skipped:', file.name, error);
                }
                if (index % 8 === 0) await new Promise(resolve => setTimeout(resolve, 0));
            }
            if (!gallery.images.length) throw new Error('No images could be imported');
            state.galleries[id] = gallery;
            insertTextAtEditorCursor(`[[CAROUSEL:${id}]]`);
            state.markdown = textarea.value;
            state.highlights = [];
            touchRevision();
            render();
            scheduleOriginalAutosave();
            const mb = compressedBytes / (1024*1024);
            setGalleryImportUi(false, `${gallery.images.length} images embedded · ${mb.toFixed(mb >= 10 ? 0 : 1)} MB`);
            setTimeout(()=>{if(galleryImportStatus)galleryImportStatus.textContent=''},5000);
        } catch (error) {
            console.error(error);
            setGalleryImportUi(false, 'Import failed');
            setTimeout(()=>{if(galleryImportStatus)galleryImportStatus.textContent=''},2500);
        }
    }

    function ensureEmbeddedGalleryLightbox() {
        let box = document.getElementById('embedded-gallery-lightbox');
        if (box) return box;
        box = document.createElement('div');
        box.id = 'embedded-gallery-lightbox';
        box.setAttribute('aria-hidden', 'true');
        box.innerHTML = `<button type="button" class="embedded-gallery-lightbox-close" aria-label="Close zoom">×</button><img alt=""><div class="embedded-gallery-lightbox-label"></div>`;
        document.body.appendChild(box);

        const image = box.querySelector('img');
        const label = box.querySelector('.embedded-gallery-lightbox-label');
        const close = box.querySelector('.embedded-gallery-lightbox-close');
        let scale = 1;
        let tx = 0;
        let ty = 0;
        let drag = null;

        function applyTransform() {
            image.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${scale})`;
            box.classList.toggle('zoomed', scale > 1.01);
        }
        function resetTransform(nextScale = 1) {
            scale = nextScale;
            tx = 0;
            ty = 0;
            applyTransform();
        }
        function closeBox() {
            box.classList.remove('open', 'zoomed', 'dragging');
            box.setAttribute('aria-hidden', 'true');
            image.removeAttribute('src');
            resetTransform(1);
        }
        box._openImage = (item, positionText='') => {
            image.src = item.data;
            image.alt = item.name || 'Zoomed image';
            label.textContent = [item.name || '', positionText].filter(Boolean).join(' · ');
            box.classList.add('open');
            box.setAttribute('aria-hidden', 'false');
            resetTransform(1.12);
        };
        close.addEventListener('click', event => { event.stopPropagation(); closeBox(); });
        box.addEventListener('click', event => {
            if (event.target === box) closeBox();
        });
        image.addEventListener('dblclick', event => {
            event.preventDefault();
            event.stopPropagation();
            resetTransform(scale > 1.2 ? 1 : 2.15);
        });
        box.addEventListener('wheel', event => {
            if (!box.classList.contains('open')) return;
            event.preventDefault();
            const next = Math.max(1, Math.min(5, scale * (event.deltaY < 0 ? 1.12 : 1 / 1.12)));
            scale = next;
            if (scale <= 1.01) { tx = 0; ty = 0; }
            applyTransform();
        }, { passive:false });
        image.addEventListener('pointerdown', event => {
            if (scale <= 1.01) return;
            event.preventDefault();
            image.setPointerCapture?.(event.pointerId);
            drag = { x:event.clientX, y:event.clientY, tx, ty };
            box.classList.add('dragging');
        });
        image.addEventListener('pointermove', event => {
            if (!drag) return;
            tx = drag.tx + event.clientX - drag.x;
            ty = drag.ty + event.clientY - drag.y;
            applyTransform();
        });
        const endDrag = () => { drag = null; box.classList.remove('dragging'); };
        image.addEventListener('pointerup', endDrag);
        image.addEventListener('pointercancel', endDrag);
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && box.classList.contains('open')) closeBox();
        });
        return box;
    }

    function embeddedGalleryPageSize(width) {
        if (width < 620) return 1;
        if (width < 860) return 2;
        if (width < 1080) return 3;
        return 4;
    }

    function renderEmbeddedGalleries() {
        renderer.querySelectorAll('.embedded-gallery').forEach(host => {
            if (host.dataset.ready === '1') return;
            host.dataset.ready = '1';
            const id = host.dataset.galleryId || '';
            const gallery = state.galleries && state.galleries[id];
            if (!gallery || !Array.isArray(gallery.images) || !gallery.images.length) {
                host.innerHTML = '<div class="embedded-gallery-shell"><div class="embedded-gallery-empty">Carousel data is missing.</div></div>';
                return;
            }

            let startIndex = 0;
            let pageSize = 1;
            let resizeFrame = 0;
            const shell = document.createElement('section');
            shell.className = 'embedded-gallery-shell';
            shell.tabIndex = 0;
            shell.innerHTML = `<div class="embedded-gallery-head"><div class="embedded-gallery-title"></div><div class="embedded-gallery-count"></div></div><div class="embedded-gallery-stage"><div class="embedded-gallery-row"></div></div><button type="button" class="embedded-gallery-arrow previous" aria-label="Previous images">‹</button><button type="button" class="embedded-gallery-arrow next" aria-label="Next images">›</button><div class="embedded-gallery-foot"><div class="embedded-gallery-filename"></div><div class="embedded-gallery-position"></div></div>`;
            host.appendChild(shell);

            const title = shell.querySelector('.embedded-gallery-title');
            const count = shell.querySelector('.embedded-gallery-count');
            const stage = shell.querySelector('.embedded-gallery-stage');
            const row = shell.querySelector('.embedded-gallery-row');
            const prev = shell.querySelector('.previous');
            const next = shell.querySelector('.next');
            const filename = shell.querySelector('.embedded-gallery-filename');
            const position = shell.querySelector('.embedded-gallery-position');
            const lightbox = ensureEmbeddedGalleryLightbox();

            title.textContent = gallery.title || id;
            count.textContent = `${gallery.images.length.toLocaleString()} images`;

            function preload(i) {
                if (i < 0 || i >= gallery.images.length) return;
                const p = new Image();
                p.decoding = 'async';
                p.src = gallery.images[i].data;
            }

            function targetRowHeight(items, availableWidth, gap) {
                const ratios = items.map(item => {
                    const w = Math.max(1, Number(item.width) || 1);
                    const h = Math.max(1, Number(item.height) || 1);
                    return Math.max(.28, Math.min(4.5, w / h));
                });
                const totalRatio = ratios.reduce((sum, ratio) => sum + ratio, 0) || 1;
                const raw = Math.max(120, (availableWidth - gap * Math.max(0, items.length - 1)) / totalRatio);
                const mobile = window.matchMedia && window.matchMedia('(max-width:760px)').matches;
                const viewportCap = mobile
                    ? Math.max(240, Math.min(620, window.innerHeight * .68))
                    : Math.max(260, Math.min(520, window.innerHeight * .62));
                return { height:Math.min(raw, viewportCap), ratios };
            }

            function renderPage() {
                const width = Math.max(1, stage.clientWidth || shell.clientWidth || 1);
                pageSize = Math.min(gallery.images.length, embeddedGalleryPageSize(width));
                const maxStart = Math.max(0, gallery.images.length - pageSize);
                startIndex = Math.max(0, Math.min(maxStart, startIndex));
                const items = gallery.images.slice(startIndex, startIndex + pageSize);
                const gap = width < 760 ? 8 : 12;
                const layout = targetRowHeight(items, width, gap);

                row.textContent = '';
                items.forEach((item, offset) => {
                    const absoluteIndex = startIndex + offset;
                    const card = document.createElement('div');
                    card.className = 'embedded-gallery-card';
                    const cardWidth = Math.max(72, Math.round(layout.height * layout.ratios[offset]));
                    card.style.width = `${cardWidth}px`;

                    const img = document.createElement('img');
                    img.className = 'embedded-gallery-image';
                    img.decoding = 'async';
                    img.loading = 'eager';
                    img.src = item.data;
                    img.alt = item.name || `Image ${absoluteIndex + 1}`;
                    img.dataset.galleryIndex = String(absoluteIndex);
                    img.title = 'Double-click to zoom';
                    img.addEventListener('dblclick', event => {
                        event.preventDefault();
                        event.stopPropagation();
                        lightbox._openImage?.(item, `${absoluteIndex + 1} / ${gallery.images.length}`);
                    });
                    card.appendChild(img);
                    row.appendChild(card);
                });

                const endIndex = Math.min(gallery.images.length - 1, startIndex + items.length - 1);
                if (items.length <= 1) {
                    position.textContent = `${startIndex + 1} / ${gallery.images.length}`;
                    filename.textContent = items[0]?.name || '';
                } else {
                    position.textContent = `${startIndex + 1}–${endIndex + 1} / ${gallery.images.length}`;
                    filename.textContent = '';
                }
                prev.disabled = startIndex <= 0;
                next.disabled = startIndex >= maxStart;

                preload(startIndex - 1);
                preload(startIndex + pageSize);
                preload(startIndex - 2);
                preload(startIndex + pageSize + 1);
            }

            function show(nextStart) {
                startIndex = nextStart;
                renderPage();
            }

            prev.addEventListener('click', () => show(startIndex - 1));
            next.addEventListener('click', () => show(startIndex + 1));
            shell.addEventListener('keydown', event => {
                if (event.key === 'ArrowLeft') { event.preventDefault(); show(startIndex - 1); }
                if (event.key === 'ArrowRight') { event.preventDefault(); show(startIndex + 1); }
                if (event.key === 'Home') { event.preventDefault(); show(0); }
                if (event.key === 'End') { event.preventDefault(); show(gallery.images.length - pageSize); }
            });

            let swipeStart = null;
            stage.addEventListener('pointerdown', event => {
                swipeStart = { x:event.clientX, y:event.clientY };
            });
            stage.addEventListener('pointerup', event => {
                if (!swipeStart) return;
                const dx = event.clientX - swipeStart.x;
                const dy = event.clientY - swipeStart.y;
                swipeStart = null;
                if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.25) {
                    show(startIndex + (dx < 0 ? 1 : -1));
                }
            });

            const rerenderAfterResize = () => {
                cancelAnimationFrame(resizeFrame);
                resizeFrame = requestAnimationFrame(renderPage);
            };
            if ('ResizeObserver' in window) {
                const observer = new ResizeObserver(rerenderAfterResize);
                observer.observe(stage);
            } else {
                window.addEventListener('resize', rerenderAfterResize, { passive:true });
            }

            requestAnimationFrame(renderPage);
        });
    }


    function renderLinkedImageGalleries() {
        renderer.querySelectorAll('.linked-image-gallery').forEach(host => {
            if (host.dataset.ready === '1') return;
            host.dataset.ready = '1';

            let urls = [];
            try { urls = JSON.parse(decodeURIComponent(host.dataset.imageLinks || '[]')); }
            catch (_) { urls = []; }
            urls = Array.isArray(urls) ? urls.filter(url => /^https?:\/\//i.test(String(url || ''))) : [];
            if (!urls.length) {
                host.innerHTML = '<div class="embedded-gallery-shell"><div class="embedded-gallery-empty">No valid image links found.</div></div>';
                return;
            }

            let startIndex = 0;
            let pageSize = 1;
            let resizeFrame = 0;
            const dimensions = new Map();
            const shell = document.createElement('section');
            shell.className = 'embedded-gallery-shell';
            shell.tabIndex = 0;
            shell.innerHTML = `<div class="embedded-gallery-stage"><div class="embedded-gallery-row"></div></div><button type="button" class="embedded-gallery-arrow previous" aria-label="Previous images">‹</button><button type="button" class="embedded-gallery-arrow next" aria-label="Next images">›</button><div class="embedded-gallery-foot"><div class="embedded-gallery-position"></div></div>`;
            host.appendChild(shell);

            const stage = shell.querySelector('.embedded-gallery-stage');
            const row = shell.querySelector('.embedded-gallery-row');
            const prev = shell.querySelector('.previous');
            const next = shell.querySelector('.next');
            const position = shell.querySelector('.embedded-gallery-position');
            const lightbox = ensureEmbeddedGalleryLightbox();

            function ratioFor(index) {
                const d = dimensions.get(index);
                if (!d) return 1.35;
                return Math.max(.28, Math.min(4.5, d.width / Math.max(1, d.height)));
            }

            function targetRowHeight(indices, availableWidth, gap) {
                const ratios = indices.map(ratioFor);
                const totalRatio = ratios.reduce((sum, ratio) => sum + ratio, 0) || 1;
                const raw = Math.max(120, (availableWidth - gap * Math.max(0, indices.length - 1)) / totalRatio);
                const mobile = window.matchMedia && window.matchMedia('(max-width:760px)').matches;
                const viewportCap = mobile
                    ? Math.max(240, Math.min(620, window.innerHeight * .68))
                    : Math.max(260, Math.min(520, window.innerHeight * .62));
                return { height:Math.min(raw, viewportCap), ratios };
            }

            function preload(index) {
                if (index < 0 || index >= urls.length || dimensions.has(index)) return;
                const probe = new Image();
                probe.decoding = 'async';
                probe.onload = () => {
                    dimensions.set(index, { width:probe.naturalWidth || 1, height:probe.naturalHeight || 1 });
                    if (index >= startIndex && index < startIndex + pageSize) scheduleRender();
                };
                probe.src = urls[index];
            }

            function scheduleRender() {
                cancelAnimationFrame(resizeFrame);
                resizeFrame = requestAnimationFrame(renderPage);
            }

            function renderPage() {
                const width = Math.max(1, stage.clientWidth || shell.clientWidth || 1);
                pageSize = Math.min(urls.length, embeddedGalleryPageSize(width));
                const maxStart = Math.max(0, urls.length - pageSize);
                startIndex = Math.max(0, Math.min(maxStart, startIndex));
                const indices = Array.from({length:pageSize}, (_, offset) => startIndex + offset).filter(i => i < urls.length);
                const gap = width < 760 ? 8 : 12;
                const layout = targetRowHeight(indices, width, gap);

                row.textContent = '';
                indices.forEach((absoluteIndex, offset) => {
                    const url = urls[absoluteIndex];
                    const card = document.createElement('div');
                    card.className = 'embedded-gallery-card';
                    card.style.width = `${Math.max(72, Math.round(layout.height * layout.ratios[offset]))}px`;

                    const img = document.createElement('img');
                    img.className = 'embedded-gallery-image';
                    img.decoding = 'async';
                    img.loading = 'eager';
                    img.src = url;
                    img.alt = `Image ${absoluteIndex + 1}`;
                    img.title = 'Double-click to zoom';
                    img.addEventListener('load', () => {
                        const nextDim = { width:img.naturalWidth || 1, height:img.naturalHeight || 1 };
                        const oldDim = dimensions.get(absoluteIndex);
                        dimensions.set(absoluteIndex, nextDim);
                        if (!oldDim || oldDim.width !== nextDim.width || oldDim.height !== nextDim.height) scheduleRender();
                    }, { once:true });
                    img.addEventListener('error', () => {
                        card.style.display = 'none';
                    }, { once:true });
                    img.addEventListener('dblclick', event => {
                        event.preventDefault();
                        event.stopPropagation();
                        lightbox._openImage?.({ data:url, name:`Image ${absoluteIndex + 1}` }, `${absoluteIndex + 1} / ${urls.length}`);
                    });
                    card.appendChild(img);
                    row.appendChild(card);
                });

                const endIndex = Math.min(urls.length - 1, startIndex + indices.length - 1);
                position.textContent = indices.length <= 1
                    ? `${startIndex + 1} / ${urls.length}`
                    : `${startIndex + 1}–${endIndex + 1} / ${urls.length}`;
                prev.disabled = startIndex <= 0;
                next.disabled = startIndex >= maxStart;

                indices.forEach(preload);
                preload(startIndex - 1);
                preload(startIndex + pageSize);
                preload(startIndex - 2);
                preload(startIndex + pageSize + 1);
            }

            function show(nextStart) {
                startIndex = nextStart;
                renderPage();
            }

            prev.addEventListener('click', () => show(startIndex - 1));
            next.addEventListener('click', () => show(startIndex + 1));
            shell.addEventListener('keydown', event => {
                if (event.key === 'ArrowLeft') { event.preventDefault(); show(startIndex - 1); }
                if (event.key === 'ArrowRight') { event.preventDefault(); show(startIndex + 1); }
                if (event.key === 'Home') { event.preventDefault(); show(0); }
                if (event.key === 'End') { event.preventDefault(); show(urls.length - pageSize); }
            });

            let swipeStart = null;
            stage.addEventListener('pointerdown', event => { swipeStart = { x:event.clientX, y:event.clientY }; });
            stage.addEventListener('pointerup', event => {
                if (!swipeStart) return;
                const dx = event.clientX - swipeStart.x;
                const dy = event.clientY - swipeStart.y;
                swipeStart = null;
                if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.25) show(startIndex + (dx < 0 ? 1 : -1));
            });

            if ('ResizeObserver' in window) {
                const observer = new ResizeObserver(scheduleRender);
                observer.observe(stage);
            } else {
                window.addEventListener('resize', scheduleRender, { passive:true });
            }

            requestAnimationFrame(renderPage);
        });
    }

    function expandSupportedGenuiTokens(source) {
        return String(source || '').replace(/genui([\s\S]*?)/g, (fullToken, jsonText) => {
            try {
                const payload = JSON.parse(jsonText);
                const spec = payload && payload.functions_sequences_graphs;
                if (!spec || spec.type_id !== 'GRAPHABLE_FUNCTION' || typeof spec.content !== 'string') return fullToken;
                const encodedExpression = encodeURIComponent(spec.content);
                return `\n<span class="genui-source-offset-keeper" aria-hidden="true">${escapeHtml(fullToken)}</span>` +
                       `<div class="genui-function-simulation" data-expression="${escapeHtml(encodedExpression)}"></div>\n`;
            } catch (_) { return fullToken; }
        });
    }

    function expandEmbeddedGalleryTokens(source) {
        const lines = String(source ?? '').replace(/\r\n?/g, '\n').split('\n');
        let fence = '';
        return lines.map(line => {
            const trimmed = line.trim();
            const fm = trimmed.match(/^(```+|~~~+)/);
            if (fence) {
                if (fm && fm[1][0] === fence[0] && fm[1].length >= fence.length) fence = '';
                return line;
            }
            if (fm) { fence = fm[1]; return line; }
            const match = trimmed.match(/^\[\[CAROUSEL:([A-Za-z0-9_-]+)\]\]$/i);
            if (!match) return line;
            const token = trimmed;
            const id = match[1];
            return `<span class="embedded-gallery-source-offset-keeper" aria-hidden="true">${escapeHtml(token)}</span><div class="embedded-gallery" data-gallery-id="${escapeHtml(id)}"></div>`;
        }).join('\n');
    }

    function preserveExtraMarkdownBlankLines(source) {
        const lines = String(source ?? '').replace(/\r\n?/g, '\n').split('\n');
        const output = [];
        let blankCount = 0;
        let fenceMarker = '';
        const flush = () => {
            if (blankCount <= 0) return;
            output.push('');
            for (let i = 1; i < blankCount; i++) output.push('<div class="markdown-extra-blank-line" aria-hidden="true"></div>');
            if (blankCount > 1) output.push('');
            blankCount = 0;
        };
        for (const line of lines) {
            const trimmed = line.trimStart();
            const fm = trimmed.match(/^(```+|~~~+)/);
            if (fenceMarker) {
                output.push(line);
                if (fm && fm[1][0] === fenceMarker[0] && fm[1].length >= fenceMarker.length) fenceMarker = '';
                continue;
            }
            if (fm) { flush(); fenceMarker = fm[1]; output.push(line); continue; }
            if (line.trim() === '') { blankCount++; continue; }
            flush(); output.push(line);
        }
        flush();
        return output.join('\n');
    }

    function expandStandaloneLinkPreviews(source) {
        const lines = String(source ?? '').replace(/\r\n?/g, '\n').split('\n');
        const output = [];
        let fence = '';
        for (const line of lines) {
            const trimmed = line.trim();
            const fm = trimmed.match(/^(```+|~~~+)/);
            if (fence) {
                output.push(line);
                if (fm && fm[1][0] === fence[0] && fm[1].length >= fence.length) fence = '';
                continue;
            }
            if (fm) { fence = fm[1]; output.push(line); continue; }
            if (/^https?:\/\/[^\s<>]+$/i.test(trimmed)) {
                const enc = encodeURIComponent(trimmed);
                output.push(`<span class="link-preview-source-offset-keeper" aria-hidden="true">${escapeHtml(trimmed)}</span><div class="smart-link-preview" data-preview-url="${escapeHtml(enc)}"></div>`);
            } else output.push(line);
        }
        return output.join('\n');
    }

    function markdownToHtml(source) {
        const normalized = preserveExtraMarkdownBlankLines(expandStandaloneLinkPreviews(normalizeImageShortcuts(expandEmbeddedGalleryTokens(expandSupportedGenuiTokens(source)))));
        if (looksLikeDecisionTree(normalized)) {
            return `<pre class="decision-tree-plain">${escapeHtml(normalized)}</pre>`;
        }
        if (window.marked && typeof window.marked.parse === 'function') {
            try {
                window.marked.setOptions({ gfm: true, breaks: true });
                return window.marked.parse(normalized);
            } catch (error) {
                console.warn('Marked failed, using fallback parser.', error);
            }
        }
        return fallbackMarkdown(normalized);
    }

    function wrapTables() {
        renderer.querySelectorAll('table').forEach(table => {
            if (table.parentElement?.classList.contains('table-shell')) return;
            const shell = document.createElement('div');
            shell.className = 'table-shell';
            table.parentNode.insertBefore(shell, table);
            shell.appendChild(table);
        });
    }

    function decorateCodeBlocks() {
        renderer.querySelectorAll('pre > code').forEach(code => {
            const pre = code.parentElement;
            if (!pre || pre.closest('.code-shell')) return;

            if (window.hljs) {
                try { window.hljs.highlightElement(code); } catch (error) { console.warn(error); }
            }

            const rawCode = code.textContent || '';
            const languageClass = [...code.classList].find(c => c.startsWith('language-')) || '';
            const language = languageClass.replace('language-', '') || 'code';
            const shell = document.createElement('div');
            shell.className = 'code-shell';

            const toolbar = document.createElement('div');
            toolbar.className = 'code-toolbar';
            toolbar.innerHTML = `
                <div class="code-toolbar-left">
                    <span class="vscode-window-dots"><span></span><span></span><span></span></span>
                    <span class="code-language-label">${escapeHtml(language)}<span class="code-language-badge">${escapeHtml(language)}</span></span>
                </div>
                <button class="code-copy-button" type="button" title="Copy code">Copy</button>`;

            const frame = document.createElement('div');
            frame.className = 'code-frame';
            const lineNumbers = document.createElement('div');
            lineNumbers.className = 'code-line-numbers';
            const lineCount = Math.max(1, rawCode.replace(/\n$/, '').split('\n').length);
            lineNumbers.innerHTML = Array.from({ length: lineCount }, (_, i) => `<span>${i + 1}</span>`).join('');

            pre.parentNode.insertBefore(shell, pre);
            shell.appendChild(toolbar);
            shell.appendChild(frame);
            frame.appendChild(lineNumbers);
            frame.appendChild(pre);

            toolbar.querySelector('.code-copy-button').addEventListener('click', async event => {
                try {
                    await navigator.clipboard.writeText(rawCode);
                    event.currentTarget.textContent = 'Copied';
                    setTimeout(() => { event.currentTarget.textContent = 'Copy'; }, 1000);
                } catch (_) {
                    const helper = document.createElement('textarea');
                    helper.value = rawCode;
                    helper.style.position = 'fixed';
                    helper.style.opacity = '0';
                    document.body.appendChild(helper);
                    helper.select();
                    document.execCommand('copy');
                    helper.remove();
                    event.currentTarget.textContent = 'Copied';
                    setTimeout(() => { event.currentTarget.textContent = 'Copy'; }, 1000);
                }
            });
        });
    }

    function getImagesFromImageOnlyBlock(element) {
        if (!element || element.nodeType !== 1) return [];
        if (element.tagName === 'IMG') return [element];

        const images = [...element.querySelectorAll('img')];
        if (!images.length) return [];

        const clone = element.cloneNode(true);
        clone.querySelectorAll('img').forEach(img => img.remove());
        clone.querySelectorAll('br').forEach(br => br.remove());
        clone.querySelectorAll('a').forEach(anchor => {
            if (!anchor.textContent.trim() && !anchor.querySelector('img')) anchor.remove();
        });

        if (clone.textContent.replace(/\u00a0/g, ' ').trim()) return [];
        return images;
    }

    function isImageOnlyBlock(element) {
        return getImagesFromImageOnlyBlock(element).length > 0;
    }

    function markdownCarouselPageSize(width) {
        if (width < 620) return 1;
        if (width < 860) return 2;
        if (width < 1080) return 3;
        return 4;
    }

    function makeCarousel(groups) {
        groups.forEach(group => {
            const imageEntries = [];
            group.forEach(block => {
                getImagesFromImageOnlyBlock(block).forEach(image => {
                    imageEntries.push({ block, image });
                });
            });

            if (imageEntries.length < 2) return;

            const carousel = document.createElement('div');
            carousel.className = 'markdown-image-carousel';
            carousel.tabIndex = 0;

            const viewport = document.createElement('div');
            viewport.className = 'markdown-image-carousel-viewport';

            imageEntries.forEach(({ block, image }, index) => {
                const card = document.createElement('div');
                card.className = 'markdown-image-carousel-card';
                card.dataset.carouselIndex = String(index);

                const anchor = image.closest('a');
                if (anchor && block.contains(anchor)) {
                    card.appendChild(anchor);
                } else {
                    card.appendChild(image);
                }
                viewport.appendChild(card);
            });

            const previous = document.createElement('button');
            previous.className = 'markdown-image-carousel-arrow previous';
            previous.type = 'button';
            previous.setAttribute('aria-label', 'Previous image');
            previous.textContent = '‹';

            const next = document.createElement('button');
            next.className = 'markdown-image-carousel-arrow next';
            next.type = 'button';
            next.setAttribute('aria-label', 'Next image');
            next.textContent = '›';

            const status = document.createElement('div');
            status.className = 'markdown-image-carousel-status';

            group[0].parentNode.insertBefore(carousel, group[0]);
            group.forEach(block => block.remove());
            carousel.append(viewport, previous, next, status);

            const cards = [...viewport.children];
            const images = cards.map(card => card.querySelector('img')).filter(Boolean);
            const lightbox = ensureEmbeddedGalleryLightbox();
            let layoutFrame = 0;

            function imageRatio(image) {
                const w = Math.max(1, Number(image?.naturalWidth) || Number(image?.width) || 1);
                const h = Math.max(1, Number(image?.naturalHeight) || Number(image?.height) || 1);
                return Math.max(.28, Math.min(4.5, w / h));
            }

            function layoutCards() {
                cancelAnimationFrame(layoutFrame);
                layoutFrame = requestAnimationFrame(() => {
                    const width = Math.max(1, viewport.clientWidth || carousel.clientWidth || 1);
                    const pageSize = Math.min(cards.length, markdownCarouselPageSize(width));
                    const gap = width < 760 ? 8 : 12;
                    const sampleRatios = images.slice(0, pageSize).map(imageRatio);
                    const sum = sampleRatios.reduce((total, ratio) => total + ratio, 0) || 1;
                    const rawHeight = Math.max(110, (width - gap * Math.max(0, pageSize - 1)) / sum);
                    const mobile = window.matchMedia && window.matchMedia('(max-width:760px)').matches;
                    const viewportCap = mobile
                        ? Math.max(220, Math.min(620, window.innerHeight * .68))
                        : Math.max(240, Math.min(520, window.innerHeight * .62));
                    const rowHeight = Math.min(rawHeight, viewportCap);

                    cards.forEach((card, index) => {
                        const ratio = imageRatio(images[index]);
                        card.style.width = `${Math.max(68, Math.round(rowHeight * ratio))}px`;
                        card.style.height = `${Math.round(rowHeight)}px`;
                    });
                    updateStatus();
                });
            }

            function visibleRange() {
                const left = viewport.scrollLeft;
                const right = left + viewport.clientWidth;
                const visible = [];
                cards.forEach((card, index) => {
                    const cardLeft = card.offsetLeft;
                    const cardRight = cardLeft + card.offsetWidth;
                    const overlap = Math.max(0, Math.min(right, cardRight) - Math.max(left, cardLeft));
                    if (overlap >= Math.min(card.offsetWidth * .45, 60)) visible.push(index);
                });
                if (!visible.length) {
                    let closest = 0;
                    let best = Infinity;
                    const center = left + viewport.clientWidth / 2;
                    cards.forEach((card, index) => {
                        const distance = Math.abs((card.offsetLeft + card.offsetWidth / 2) - center);
                        if (distance < best) { best = distance; closest = index; }
                    });
                    visible.push(closest);
                }
                return { first:visible[0], last:visible[visible.length - 1] };
            }

            function updateStatus() {
                const range = visibleRange();
                const firstNumber = range.first + 1;
                const lastNumber = range.last + 1;
                status.textContent = firstNumber === lastNumber
                    ? `${firstNumber} / ${cards.length}`
                    : `${firstNumber}–${lastNumber} / ${cards.length}`;
                previous.disabled = range.first <= 0 && viewport.scrollLeft <= 2;
                next.disabled = range.last >= cards.length - 1 && viewport.scrollLeft + viewport.clientWidth >= viewport.scrollWidth - 2;
            }

            function scrollByCard(direction) {
                const range = visibleRange();
                const targetIndex = direction > 0
                    ? Math.min(cards.length - 1, range.first + 1)
                    : Math.max(0, range.first - 1);
                const target = cards[targetIndex];
                if (!target) return;
                viewport.scrollTo({ left:Math.max(0, target.offsetLeft), behavior:'smooth' });
            }

            images.forEach((image, index) => {
                image.loading = index < 4 ? 'eager' : 'lazy';
                image.decoding = 'async';
                image.title = 'Double-click to zoom';
                image.addEventListener('load', layoutCards, { passive:true });
                image.addEventListener('error', layoutCards, { passive:true });
                image.addEventListener('dblclick', event => {
                    event.preventDefault();
                    event.stopPropagation();
                    const src = image.currentSrc || image.src || image.getAttribute('src') || '';
                    if (!src) return;
                    lightbox._openImage?.({
                        data:src,
                        name:image.alt || `Image ${index + 1}`
                    }, `${index + 1} / ${cards.length}`);
                });
            });

            previous.addEventListener('click', () => scrollByCard(-1));
            next.addEventListener('click', () => scrollByCard(1));
            viewport.addEventListener('scroll', () => requestAnimationFrame(updateStatus), { passive: true });
            carousel.addEventListener('keydown', event => {
                if (event.key === 'ArrowLeft') { event.preventDefault(); scrollByCard(-1); }
                if (event.key === 'ArrowRight') { event.preventDefault(); scrollByCard(1); }
            });

            if ('ResizeObserver' in window) {
                const observer = new ResizeObserver(layoutCards);
                observer.observe(viewport);
            } else {
                window.addEventListener('resize', layoutCards, { passive:true });
            }

            layoutCards();
            updateStatus();
        });
    }

    function groupImagesIntoCarousels() {
        const children = [...renderer.children];
        const groups = [];
        let current = [];

        for (const child of children) {
            if (isImageOnlyBlock(child)) {
                current.push(child);
                continue;
            }

            const isEmptySpacer = !child.textContent.trim()
                && !child.querySelector('img, pre, code, table, hr, video, iframe');
            if (isEmptySpacer && current.length) continue;

            if (current.length) groups.push(current);
            current = [];
        }
        if (current.length) groups.push(current);
        makeCarousel(groups);
    }

    function setupImages() {
        renderer.querySelectorAll('img').forEach(img => {
            img.loading = 'lazy';
            img.addEventListener('error', () => {
                img.classList.add('local-image-error');
                img.alt = img.alt || 'Image could not be loaded';
                img.title = 'Image could not be loaded from: ' + (img.getAttribute('src') || '');
            }, { once: true });
        });
    }

    function applyVisualState() {
        document.documentElement.style.setProperty('--unused', '0');
        const mobile = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
        const displayFontSize = mobile ? clamp(Math.round(state.fontSize * 0.78 * 10) / 10, 6.5, 26) : state.fontSize;
        document.documentElement.classList.toggle('mobile-compact-level-1', mobile && state.fontSize <= 11);
        document.documentElement.classList.toggle('mobile-compact-level-2', mobile && state.fontSize <= 9);
        renderer.style.setProperty('--content-base-font-size', `${displayFontSize}px`);
        renderer.style.setProperty('--content-horizontal-offset', `${state.horizontalOffset}px`);
        fontDecreaseButton.disabled = state.fontSize <= 7;
        fontIncreaseButton.disabled = state.fontSize >= 34;
        shiftLeftButton.disabled = state.horizontalOffset <= -360;
        shiftRightButton.disabled = state.horizontalOffset >= 360;
    }

    function getRendererTextOffsets(range) {
        if (!range || range.collapsed || !renderer.contains(range.commonAncestorContainer)) return null;
        try {
            const beforeStart = document.createRange();
            beforeStart.selectNodeContents(renderer);
            beforeStart.setEnd(range.startContainer, range.startOffset);
            const beforeEnd = document.createRange();
            beforeEnd.selectNodeContents(renderer);
            beforeEnd.setEnd(range.endContainer, range.endOffset);
            const start = beforeStart.toString().length;
            const end = beforeEnd.toString().length;
            if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
            return { start, end };
        } catch (_) {
            return null;
        }
    }

    function captureCurrentSelection() {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
        const offsets = getRendererTextOffsets(selection.getRangeAt(0));
        if (offsets) pendingSelectionOffsets = offsets;
        return offsets;
    }

    function makeRangeFromOffsets(start, end) {
        const walker = document.createTreeWalker(renderer, NodeFilter.SHOW_TEXT);
        let node;
        let total = 0;
        let startNode = null, endNode = null, startOffset = 0, endOffset = 0;
        while ((node = walker.nextNode())) {
            const next = total + node.nodeValue.length;
            if (!startNode && start >= total && start <= next) {
                startNode = node;
                startOffset = Math.max(0, Math.min(node.nodeValue.length, start - total));
            }
            if (!endNode && end >= total && end <= next) {
                endNode = node;
                endOffset = Math.max(0, Math.min(node.nodeValue.length, end - total));
                break;
            }
            total = next;
        }
        if (!startNode || !endNode) return null;
        const range = document.createRange();
        range.setStart(startNode, startOffset);
        range.setEnd(endNode, endOffset);
        return range;
    }

    function wrapRangeSegments(range, id, color) {
        const walker = document.createTreeWalker(renderer, NodeFilter.SHOW_TEXT);
        const pieces = [];
        let node;
        while ((node = walker.nextNode())) {
            if (!node.nodeValue || !node.nodeValue.length) continue;
            try {
                if (!range.intersectsNode(node)) continue;
            } catch (_) { continue; }
            let start = 0;
            let end = node.nodeValue.length;
            if (node === range.startContainer) start = range.startOffset;
            if (node === range.endContainer) end = range.endOffset;
            if (end > start) pieces.push({ node, start, end });
        }
        for (let i = pieces.length - 1; i >= 0; i--) {
            const piece = pieces[i];
            const part = document.createRange();
            part.setStart(piece.node, piece.start);
            part.setEnd(piece.node, piece.end);
            const mark = document.createElement('mark');
            mark.dataset.highlightId = id;
            mark.dataset.highlightColor = color;
            try { part.surroundContents(mark); } catch (_) {}
        }
    }

    function paintHighlightRecord(record) {
        if (!record || !allowedHighlightColors.has(record.color)) return;
        const range = makeRangeFromOffsets(Number(record.start), Number(record.end));
        if (!range || range.collapsed) return;
        wrapRangeSegments(range, String(record.id), record.color);
    }

    function restoreStoredHighlights() {
        const clean = Array.isArray(state.highlights) ? state.highlights.filter(item =>
            item && allowedHighlightColors.has(item.color) && Number(item.end) > Number(item.start)
        ) : [];
        state.highlights = clean;
        clean.slice().sort((a, b) => Number(b.start) - Number(a.start)).forEach(paintHighlightRecord);
    }

    function render() {
        renderer.innerHTML = markdownToHtml(state.markdown);
        wrapTables();
        decorateCodeBlocks();
        groupImagesIntoCarousels();
        setupImages();
        renderFunctionSimulations();
        renderSmartLinkPreviews();
        renderEmbeddedGalleries();
        renderLinkedImageGalleries();
        restoreStoredHighlights();
        applyVisualState();
    }

    function updateDocumentSize() {
        if (documentSize) documentSize.textContent = `${textarea.value.length.toLocaleString()} characters`;
    }

    function openEditor() {
        clearTimeout(editorCommitTimer);
        textarea.value = state.markdown;
        updateDocumentSize();
        editorModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(() => {
            textarea.focus({ preventScroll: true });
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        });
    }

    function commitEditor({ close = false, showToast = false } = {}) {
        const nextMarkdown = textarea.value;
        const changed = nextMarkdown !== state.markdown;
        if (changed) {
            state.markdown = nextMarkdown;
            pruneOrphanedGalleries(nextMarkdown);
            state.highlights = [];
            touchRevision();
            render();
            scheduleOriginalAutosave();
        } else {
            persistEmbeddedStateInPage();
            persistLocalState();
        }
        if (close) {
            editorModal.classList.add('hidden');
            document.body.style.overflow = '';
            openEditorButton.focus({ preventScroll: true });
        }
        if (showToast) showStatus(changed ? 'Saved in browser' : 'No text changes');
        return changed;
    }

    async function saveAndCloseEditor() {
        clearTimeout(editorCommitTimer);
        commitEditor({ close: false, showToast: false });
        saveButton.disabled = true;
        saveButton.textContent = 'Saving…';

        try {
            const result = await savePortableHtmlInteractive();

            editorModal.classList.add('hidden');
            document.body.style.overflow = '';
            try { openEditorButton.focus({ preventScroll: true }); } catch (_) {}

            if (result.method === 'download') {
                showStatus('CREATED: ' + result.filename + ' — this is the file that contains your note.', 9000);
            } else {
                showStatus('SAVED INTO: ' + result.filename + ' — note is physically inside the HTML.', 6500);
            }
        } catch (error) {
            if (error && error.name === 'AbortError') {
                showStatus('Save cancelled. The physical HTML file was NOT changed.', 5000);
            } else {
                console.error(error);
                showStatus('Physical file save failed. Keep the editor open and try again.', 6500);
            }
        } finally {
            saveButton.disabled = false;
            saveButton.textContent = 'Save & Close';
        }
    }

    function scheduleEditorAutosave() {
        clearTimeout(editorCommitTimer);
        editorCommitTimer = setTimeout(() => commitEditor({ close: false, showToast: false }), 250);
    }

    function setFontSize(next) {
        const value = clamp(Number(next) || 18, 7, 34);
        if (value === state.fontSize) return;
        state.fontSize = value;
        touchRevision();
        applyVisualState();
        scheduleOriginalAutosave();
        showStatus(`Font ${value}px`, 1200);
    }

    function setHorizontalOffset(next) {
        const value = clamp(Number(next) || 0, -360, 360);
        if (value === state.horizontalOffset) return;
        state.horizontalOffset = value;
        applyVisualState();
    }

    async function enterFullscreen() {
        try {
            const target = document.documentElement;
            if (target.requestFullscreen) await target.requestFullscreen();
            else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        } catch (error) {
            showStatus('Fullscreen unavailable');
        }
    }

    async function exitFullscreen() {
        try {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } catch (error) {
            showStatus('Could not exit fullscreen');
        }
    }

    function updateFullscreenButtons() {
        const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        fullscreenEnterButton.disabled = active;
        fullscreenExitButton.disabled = !active;
        document.documentElement.classList.toggle('fullscreen-clean-mode', active);
        if (active) {
            clearHighlightMode();
            requestAnimationFrame(() => {
                scrollArea.scrollLeft = 0;
            });
        }
    }

    function clearHighlightMode() {
        activeHighlightMode = '';
        renderer.classList.remove('highlight-color-active', 'unhighlight-active');
        highlightButtons.forEach(button => {
            button.classList.remove('active');
            button.setAttribute('aria-pressed', 'false');
        });
    }

    function setHighlightMode(mode) {
        if (activeHighlightMode === mode) {
            clearHighlightMode();
            return;
        }
        clearHighlightMode();
        activeHighlightMode = mode;
        const selectedButton = highlightButtons.find(button => button.dataset.highlightMode === mode);
        if (selectedButton) {
            selectedButton.classList.add('active');
            selectedButton.setAttribute('aria-pressed', 'true');
        }
        renderer.classList.toggle('highlight-color-active', allowedHighlightColors.has(mode));
        renderer.classList.toggle('unhighlight-active', mode === 'unhighlight');
    }

    function applyOffsetsHighlight(offsets, color = activeHighlightMode) {
        if (!offsets || !allowedHighlightColors.has(color)) return false;
        const start = Number(offsets.start);
        const end = Number(offsets.end);
        if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return false;
        const record = {
            id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
            color,
            start,
            end
        };
        state.highlights.push(record);
        paintHighlightRecord(record);
        pendingSelectionOffsets = null;
        try { window.getSelection()?.removeAllRanges(); } catch (_) {}
        touchRevision();
        scheduleOriginalAutosave();
        showStatus('Highlighted', 900);
        return true;
    }

    function applySelectionHighlight() {
        if (Date.now() < suppressAutoHighlightUntil) return;
        if (!allowedHighlightColors.has(activeHighlightMode)) return;
        const offsets = captureCurrentSelection() || pendingSelectionOffsets;
        if (!offsets) return;
        applyOffsetsHighlight(offsets, activeHighlightMode);
    }

    function installEvents() {
        openEditorButton.addEventListener('click', event => {
            event.preventDefault();
            openEditor();
        });

        saveButton.addEventListener('click', event => {
            event.preventDefault();
            saveAndCloseEditor();
        });


        addImagesButton?.addEventListener('click', event => {
            event.preventDefault();
            if (!galleryImportBusy) embeddedImagesInput?.click();
        });
        addFolderButton?.addEventListener('click', event => {
            event.preventDefault();
            if (!galleryImportBusy) embeddedFolderInput?.click();
        });
        embeddedImagesInput?.addEventListener('change', async () => {
            const files = [...(embeddedImagesInput.files || [])];
            embeddedImagesInput.value = '';
            await importImageFilesAsGallery(files, '');
        });
        embeddedFolderInput?.addEventListener('change', async () => {
            const files = [...(embeddedFolderInput.files || [])];
            embeddedFolderInput.value = '';
            const rel = files.find(file => file.webkitRelativePath)?.webkitRelativePath || '';
            const folderName = rel ? rel.split('/')[0] : '';
            await importImageFilesAsGallery(files, folderName);
        });
        textarea.addEventListener('paste', async event => {
            const images = [...(event.clipboardData?.files || [])].filter(file => /^image\//i.test(file.type || ''));
            if (!images.length || galleryImportBusy) return;
            event.preventDefault();
            await importImageFilesAsGallery(images, 'Pasted Images');
        });

        textarea.addEventListener('input', () => {
            updateDocumentSize();
            scheduleEditorAutosave();
        });

        textarea.addEventListener('keydown', event => {
            if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                event.preventDefault();
                saveAndCloseEditor();
            }
            if (event.key === 'Tab') {
                event.preventDefault();
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                textarea.setRangeText('    ', start, end, 'end');
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
            }
        });

        document.addEventListener('keydown', event => {
            const isAltC = event.altKey && !event.ctrlKey && !event.metaKey && String(event.key).toLowerCase() === 'c';
            if (isAltC) {
                event.preventDefault();
                event.stopPropagation();
                openEditor();
                return;
            }
        }, true);

        fontDecreaseButton.addEventListener('click', () => setFontSize(state.fontSize - 1));
        fontIncreaseButton.addEventListener('click', () => setFontSize(state.fontSize + 1));
        shiftLeftButton.addEventListener('click', () => setHorizontalOffset(state.horizontalOffset - 24));
        shiftRightButton.addEventListener('click', () => setHorizontalOffset(state.horizontalOffset + 24));
        fullscreenEnterButton.addEventListener('click', enterFullscreen);
        fullscreenExitButton.addEventListener('click', exitFullscreen);
        fullscreenFloatingExitButton.addEventListener('click', exitFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenButtons);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButtons);
        window.addEventListener('resize', applyVisualState, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(applyVisualState, 100), { passive: true });

        highlightButtons.forEach(button => {
            button.addEventListener('pointerdown', () => captureCurrentSelection(), { passive: true });
            button.addEventListener('touchstart', () => captureCurrentSelection(), { passive: true });
            button.addEventListener('click', () => {
                const mode = button.dataset.highlightMode || '';
                const savedSelection = pendingSelectionOffsets;
                if (savedSelection && allowedHighlightColors.has(mode)) {
                    if (activeHighlightMode !== mode) setHighlightMode(mode);
                    applyOffsetsHighlight(savedSelection, mode);
                    return;
                }
                setHighlightMode(mode);
            });
        });

        document.addEventListener('selectionchange', () => {
            clearTimeout(selectionCaptureTimer);
            selectionCaptureTimer = setTimeout(() => captureCurrentSelection(), 70);
        });

        renderer.addEventListener('mouseup', () => setTimeout(applySelectionHighlight, 40));
        renderer.addEventListener('touchend', () => setTimeout(applySelectionHighlight, 180), { passive: true });
        renderer.addEventListener('pointerup', event => {
            if (event.pointerType === 'touch') setTimeout(applySelectionHighlight, 180);
        }, { passive: true });

        function removeHighlightById(id) {
            if (!id) return;
            renderer.querySelectorAll('mark[data-highlight-id]').forEach(item => {
                if (String(item.dataset.highlightId) === String(id)) item.replaceWith(...item.childNodes);
            });
            state.highlights = state.highlights.filter(item => String(item.id) !== String(id));
            touchRevision();
            scheduleOriginalAutosave();
        }

        renderer.addEventListener('click', event => {
            if (activeHighlightMode !== 'unhighlight') return;
            const mark = event.target.closest('mark[data-highlight-id]');
            if (!mark || !renderer.contains(mark)) return;
            removeHighlightById(mark.dataset.highlightId);
        });

        renderer.addEventListener('dblclick', event => {
            const mark = event.target.closest('mark[data-highlight-id]');
            if (!mark || !renderer.contains(mark)) return;
            event.preventDefault();
            suppressAutoHighlightUntil = Date.now() + 500;
            pendingSelectionOffsets = null;
            try { window.getSelection()?.removeAllRanges(); } catch (_) {}
            removeHighlightById(mark.dataset.highlightId);
        });

        window.addEventListener('beforeunload', () => {
            if (!editorModal.classList.contains('hidden')) {
                clearTimeout(editorCommitTimer);
                state.markdown = textarea.value;
                touchRevision();
            } else {
                persistLocalState();
            }
        });
    }

    persistEmbeddedStateInPage();
    persistLocalState();
    render();
    installEvents();
    updateDocumentSize();
    updateFullscreenButtons();
    restoreWritableHandleWithoutPrompt().catch(() => {});
})();
    </script>
</body>
</html>
